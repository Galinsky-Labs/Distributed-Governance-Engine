name: Publish verified Quill candidates
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-source:
    name: Verify exact published source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Require successful exact-head main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-publication-source.mjs

  publish-offline:
    name: Publish verified standalone editors
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: quill-offline-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build verified public drafting previews
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm run build:offline
      - name: Publish permanent preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view quill-offline-preview >/dev/null 2>&1; then
            gh release create quill-offline-preview --target "$GITHUB_SHA" --prerelease --title "Quill offline editor preview" --notes "CivicQuill and CharterQuill public-document drafting previews. These files are not the hosted SaaS, do not store private data securely, and do not provide authenticated governance voting, binding adoption, e-signing, or blockchain commitments. Export JSON to preserve drafts."
          fi
          gh release upload quill-offline-preview dist/offline/CivicQuill.html dist/offline/CharterQuill.html --clobber


  publish-governance:
    name: Publish tested governance app source bundle
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: quill-governance-candidate-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - name: Assemble tested integrated application
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/quill-governance"
          cp -R dist server src editor web migrations scripts deploy "$RUNNER_TEMP/quill-governance/"
          cp package.json package-lock.json Dockerfile .dockerignore "$RUNNER_TEMP/quill-governance/"
          mkdir -p "$RUNNER_TEMP/quill-governance/docs"
          cp docs/PRODUCTION_RUNBOOK.md docs/IDENTITY_PROVIDER.md docs/PASSKEY_VERIFIER.md docs/PROVIDER_RESTORATION.md "$RUNNER_TEMP/quill-governance/docs/"
          tar -czf Quill-Governance-Engine.tgz -C "$RUNNER_TEMP/quill-governance" .
      - name: Publish permanent integrated-app prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view quill-governance-candidate >/dev/null 2>&1; then
            gh release create quill-governance-candidate --target "$GITHUB_SHA" --prerelease --title "Quill governance application candidate" --notes "Tested authenticated Quill governance application: workspaces, public documents, amendment proposals, structured arguments, member votes, recorded closure, and public verification receipts. Requires configured PostgreSQL, OIDC, application TLS and migration setup. Not hosted or certified for legally binding execution, private-data storage, signatures or independent blockchain finality."
          fi
          gh release upload quill-governance-candidate Quill-Governance-Engine.tgz --clobber
