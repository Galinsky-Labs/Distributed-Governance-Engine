name: Foundation verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DGE_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/dge_identity_test
      DGE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.browser-cache/chrome-headless-shell/linux-155.0.8059.84/chrome-headless-shell-linux64/chrome-headless-shell
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: dge_identity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d dge_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .browser-cache
          key: chrome-headless-shell-linux-155.0.8059.84
      - name: Verify runtime
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm run test:postgres && npm run build && npm run build:offline
      - name: Verify browser account journey
        run: node_modules/.bin/browsers install chrome-headless-shell@155.0.8059.84 --path .browser-cache && chmod u+x "$DGE_BROWSER_EXECUTABLE" && npm run test:browser
      - name: Publish standalone editor previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: civicquill-charterquill-offline
          path: |
            dist/offline/CivicQuill.html
            dist/offline/CharterQuill.html
          if-no-files-found: error
          retention-days: 7

  publish-offline:
    name: Publish verified standalone editors
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: quill-offline-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build verified public drafting previews
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm run build:offline
      - name: Publish permanent preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view quill-offline-preview >/dev/null 2>&1; then
            gh release create quill-offline-preview --target "$GITHUB_SHA" --prerelease --title "Quill offline editor preview" --notes "CivicQuill and CharterQuill public-document drafting previews. These files are not the hosted SaaS, do not store private data securely, and do not provide authenticated governance voting, binding adoption, e-signing, or blockchain commitments. Export JSON to preserve drafts."
          fi
          gh release upload quill-offline-preview dist/offline/CivicQuill.html dist/offline/CharterQuill.html --clobber
