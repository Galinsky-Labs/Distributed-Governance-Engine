name: Foundation verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DGE_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/dge_identity_test
      DGE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.browser-cache/chrome-headless-shell/linux-155.0.8059.84/chrome-headless-shell-linux64/chrome-headless-shell
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: dge_identity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d dge_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .browser-cache
          key: chrome-headless-shell-linux-155.0.8059.84
      - name: Verify runtime
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm run test:postgres && npm run build && npm run build:offline
      - name: Verify browser account journey
        run: node_modules/.bin/browsers install chrome-headless-shell@155.0.8059.84 --path .browser-cache && chmod u+x "$DGE_BROWSER_EXECUTABLE" && node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/github-test-reporter.mjs --test-reporter-destination=stdout tests/*.browser.mjs
      - name: Publish standalone editor previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: civicquill-charterquill-offline
          path: |
            dist/offline/CivicQuill.html
            dist/offline/CharterQuill.html
          if-no-files-found: error
          retention-days: 7

  identity-provider:
    name: Verify real OIDC identity provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DGE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.browser-cache/chrome-headless-shell/linux-155.0.8059.84/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .browser-cache
          key: chrome-headless-shell-linux-155.0.8059.84
      - name: Build actual engine client and install pinned browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node_modules/.bin/browsers install chrome-headless-shell@155.0.8059.84 --path .browser-cache
          chmod u+x "$DGE_BROWSER_EXECUTABLE"
      - name: Verify real provider TLS, password and OTP through the engine
        env:
          DGE_IDENTITY_TEST_STATE: ${{ runner.temp }}/quill-identity-state.json
        run: |
          set -euo pipefail
          trap 'python3 scripts/identity-provider-fixture.py --state "$DGE_IDENTITY_TEST_STATE" --stop' EXIT
          python3 scripts/identity-provider-fixture.py --state "$DGE_IDENTITY_TEST_STATE"
          node scripts/run-identity-provider-test.mjs

  image:
    name: Build actual governance runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the actual application container
        run: docker build --progress=plain --tag quill-governance:verify .
      - name: Refuse startup without identity, database and TLS configuration
        run: |
          set +e
          docker run --rm --network none quill-governance:verify > "$RUNNER_TEMP/startup.log" 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Runtime booted without production credentials" >&2
            exit 1
          fi
          grep -Fq 'Account service startup failed' "$RUNNER_TEMP/startup.log"
      - name: Verify unprivileged image contains compiled governance frontend
        run: |
          docker run --rm --entrypoint /bin/sh quill-governance:verify -c 'test "$(id -u)" != "0" && test -s dist/app.js && test -s dist/app.css && test -s server/decision-store.mjs && test -s server/decision-http.mjs && test -s migrations/017-public-decision-receipts.sql'

  mls-endpoint:
    name: Verify MLS endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DGE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.browser-cache/chrome-headless-shell/linux-155.0.8059.84/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .browser-cache
          key: chrome-headless-shell-linux-155.0.8059.84
      - name: Install pinned endpoint build tools
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          python3 scripts/install-mls-tools.py "$RUNNER_TEMP/quill-mls-tools"
          echo "$RUNNER_TEMP/quill-mls-tools" >> "$GITHUB_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/browsers install chrome-headless-shell@155.0.8059.84 --path .browser-cache
          chmod u+x "$DGE_BROWSER_EXECUTABLE"
      - name: Verify native and isolated browser MLS endpoints
        run: |
          cargo +1.94.0 fmt --manifest-path crypto/mls-endpoint/Cargo.toml -- --check
          cargo +1.94.0 clippy --locked --manifest-path crypto/mls-endpoint/Cargo.toml --all-targets -- -D warnings
          cargo +1.94.0 clippy --locked --target wasm32-unknown-unknown --manifest-path crypto/mls-endpoint/Cargo.toml --lib -- -D warnings
          cargo +1.94.0 audit --file crypto/mls-endpoint/Cargo.lock
          npm run build:mls
          npm run test:mls
      - name: Preserve endpoint module for source review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quill-mls-endpoint-experimental
          path: dist/mls/
          if-no-files-found: error
          retention-days: 7
