[package]
name = "quill-mls-endpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = {git = "https://github.com/openmls/openmls.git", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3", features = ["js"]}
openmls_traits = {git = "https://github.com/openmls/openmls.git", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3"}
openmls_rust_crypto = {git = "https://github.com/openmls/openmls.git", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3"}
openmls_basic_credential = {git = "https://github.com/openmls/openmls.git", rev = "28369d5b48608bef4ddf8371d91503b0f3852bb3"}
wasm-bindgen = "=0.2.130"
serde = {version = "=1.0.229", features = ["derive"]}
serde_json = "=1.0.154"
zeroize = "=1.9.1"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = {version="=0.3.107", features=["Crypto", "CryptoKey", "SubtleCrypto"]}

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
